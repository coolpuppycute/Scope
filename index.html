<!DOCTYPE html>
<html>
<head>
  <title>Scope</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #eaeaea;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: #1a1d24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    .card {
      background: #1a1d24;
      padding: 15px;
      border-radius: 10px;
    }

    /* Make Google widget blend in */
    .gcse-search {
      color: #000;
    }
  </style>

  <script async src="https://cse.google.com/cse.js?cx=701a8b0d424fb4d14"></script>
</head>

<body>

  <div class="header">
    <div class="logo">
      <img src="https://via.placeholder.com/42" alt="Scope Logo">
    </div>
    <h1>Scope</h1>
  </div>

  <div class="card">
    <div class="gcse-search"></div>
  </div>

</body>
</html>
