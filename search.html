<!DOCTYPE html>
<html>
<head>
  <title>Scope Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #eaeaea;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
  height: auto;
  width: auto;
  max-height: 200px;
}

    .logo img {
     height: auto;
  width: auto;
  max-height: 200px;
}

    h1 {
      font-size: 22px;
      margin: 0;
    }

    .card {
      background: #1a1d24;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    iframe {
      width: 100%;
      height: 70vh;
      border: none;
      border-radius: 10px;
      background: white;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-top: 8px;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 14px;
      background: #4c7dff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>

  <!-- Google CSE -->
  <script async src="https://cse.google.com/cse.js?cx=701a8b0d424fb4d14"></script>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <img src="SCOPE.png" alt="Scope Logo">
    </div>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <h1>PWS</h1>
    <div class="gcse-search"></div>
  </div>

  <!-- EMBED CONTROLS -->
  <div class="card">
    <h3>Embed Viewer</h3>

    <input id="urlInput" placeholder="Enter URL (example.com or https://example.com)">
    <button onclick="loadSite()">Load Site</button>
  </div>

  <!-- EMBED FRAME -->
  <div class="card">
    <iframe id="viewer"></iframe>
  </div>

  <!-- JS (CORRECTLY PLACED) -->
  <script>
    function loadSite() {
      let url = document.getElementById("urlInput").value.trim();

      if (!url) return;

      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      document.getElementById("viewer").src = url;
    }
  </script>

</body>
